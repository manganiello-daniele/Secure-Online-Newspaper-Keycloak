{% extends 'base.html' %}
{% block content %}
<h2>Area amministratore</h2>
<p class="text-muted">
  Accesso protetto dalla policy <code>admin-dashboard#view</code> in Keycloak.
</p>

<div class="row g-3 mt-3">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Articoli da approvare</h5>
        <p class="card-text">
          Attualmente ci sono <strong>{{ non_approvati }}</strong> articoli in attesa di approvazione.
        </p>
        <a href="{{ url_for('admin.articoli_da_approvare') }}" class="btn btn-outline-primary">
          Vai alla lista
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
